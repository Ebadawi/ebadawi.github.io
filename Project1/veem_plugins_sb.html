<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veem – Unified Plugin Tester</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/veem-web-sdk@^0/umd/index.min.js" type="application/javascript"></script>
  <style>
    :root { --border:#e5e7eb; --card:#fff; --bg:#f9fafb; --btn:#0057ff; --btn-hover:#0041cc; --text:#1a1a1a; --muted:#6b7280; }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Roboto',system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:1rem 1.5rem}
    h1{margin:0;font-size:1.25rem}
    .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.75rem;padding:1rem 1.5rem;background:var(--card);border-bottom:1px solid var(--border);align-items:center}
    .grid label{text-align:right;color:var(--muted);font-size:.9rem}
    .grid input{width:100%;padding:.55rem .65rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.95rem;background:#fff}
    .actions{display:flex;flex-wrap:wrap;gap:.75rem;padding:.75rem 1.5rem 1.25rem;background:var(--card);border-bottom:1px solid var(--border)}
    button{border:none;border-radius:.5rem;padding:.6rem 1rem;font-weight:600;cursor:pointer}
    .primary{background:var(--btn);color:#fff}
    .primary:hover{background:var(--btn-hover)}
    .ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    #layout{display:grid;grid-template-columns:1fr 360px;gap:1rem;max-width:1200px;margin:1rem auto;padding:0 1rem}
    #plugin-card,#result-card{background:var(--card);border:1px solid var(--border);border-radius:.75rem}
    #plugin-card{min-height:240px;padding:1rem}
    #plugin-container{display:flex;flex-direction:column;gap:1rem}
    .plugin-target{min-height:200px;border:1px dashed var(--border);border-radius:.5rem;padding:.5rem}
    .plugin-label{font-size:.85rem;color:var(--muted);margin:0 0 .25rem .25rem}
    #result-card header{padding:.75rem 1rem;border-bottom:1px solid var(--border);font-weight:700}
    #result{padding:1rem;max-height:420px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:.9rem;white-space:pre-wrap}
    .hint{font-size:.85rem;color:var(--muted);padding:0 1.5rem 1rem;background:var(--card);border-bottom:1px solid var(--border)}
  </style>
</head>
<body>
  <header><h1>Veem – Unified Plugin Tester</h1></header>

  <div class="grid">
    <label for="accountId">accountId</label><input id="accountId" type="number" placeholder="accountId" />
    <label for="sessionSecret">sessionSecret</label><input id="sessionSecret" type="text" placeholder="sessionSecret" />
    <label for="clientId">clientId</label><input id="clientId" type="text" placeholder="clientId" />
  </div>
  <div class="hint">Tip: prefill via URL, e.g. <code>?accountId=973226&amp;sessionSecret=b45091d6550ec6656bb0a294b5859057&amp;clientId=testQAwhish-5XG09EeqyV</code></div>

  <div class="actions">
    <button class="primary" id="btn-card">Collect card info</button>
    <button class="primary" id="btn-bank">Collect bank info</button>
    <button class="primary" id="btn-boi">Collect BOI info</button>
    <button class="ghost"   id="btn-update-url" title="Write current inputs to the page URL">Update URL</button>
  </div>

  <div id="layout">
    <div id="plugin-card">
      <div id="plugin-container"><!-- Each launch appends a new plugin target; old ones remain --></div>
    </div>
    <aside id="result-card">
      <header>Latest callback result</header>
      <div id="result">No results yet.</div>
    </aside>
  </div>

  <script>
    // Visible defaults
    const DEFAULTS = {
      accountId: "973226",
      sessionSecret: "b45091d6550ec6656bb0a294b5859057",
      clientId: "testQAwhish-5XG09EeqyV",
      environment: "sandbox"
    };

    // Prefill inputs from URL or defaults
    (function prefill() {
      const p = new URLSearchParams(location.search);
      accountId.value   = p.get("accountId")    || DEFAULTS.accountId;
      sessionSecret.value = p.get("sessionSecret") || DEFAULTS.sessionSecret;
      clientId.value    = p.get("clientId")     || DEFAULTS.clientId;
    })();

    // Write inputs back to URL (handy for sharing/reloads)
    function writeInputsToUrl() {
      const q = new URLSearchParams({
        accountId: accountId.value || DEFAULTS.accountId,
        sessionSecret: sessionSecret.value || DEFAULTS.sessionSecret,
        clientId: clientId.value || DEFAULTS.clientId,
      });
      history.replaceState(null, "", `${location.pathname}?${q.toString()}`);
    }
    document.getElementById('btn-update-url').addEventListener('click', writeInputsToUrl);

    // Helpers
    function renderResult(payload) {
      const el = document.getElementById('result');
      el.textContent = typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2);
    }
    function clearResultPanel() { renderResult(''); }

    function buildConfig() {
      return {
        accountId: Number(accountId.value || DEFAULTS.accountId),
        sessionSecret: (sessionSecret.value || DEFAULTS.sessionSecret).trim(),
        clientId: (clientId.value || DEFAULTS.clientId).trim(),
        style: {
          typography: {
            fontFamily: 'Roboto', color: '#1A1A1A', weight: 400, fontSize: 14,
            error: { fontFamily: 'Roboto', fontSize: 14, weight: 400, color: '#B6353B' },
          },
          header: { fontFamily: 'Roboto', fontSize: 22, weight: 700 },
          input: {
            backgroundColor: '#FFF', borderColor: '#B0B7BF', placeholderColor: '#B0B7BF',
            height: 36, borderRadius: 2,
            paddingTop: 8, paddingRight: 8, paddingBottom: 8, paddingLeft: 16,
            error: {
              backgroundColor: '#FFEBEC', borderColor: '#B6353B', placeholderColor: '#B0B7BF',
              height: 36, borderRadius: 2,
              paddingTop: 8, paddingRight: 8, paddingBottom: 8, paddingLeft: 16,
            },
          },
          button: {
            height: 40, minWidth: 100,
            padding: { top: 10, right: 24, bottom: 10, left: 24 },
            textTransform: 'capitalize', backgroundColor: '#1A1A1A', color: '#FFF',
            fontFamily: 'Roboto', fontSize: 16, weight: 600, borderRadius: 4,
            border: { color: '#1A1A1A', width: 1, style: 'solid' },
            hover: { backgroundColor: '#333333', color: '#FFF' },
            disabled: { backgroundColor: '#E0E0E0', color: '#B0B7BF' },
          },
        },
      };
    }

    function genReferenceId() {
      return 'ref-' + ([1e7]+-1e3+-4e3+-8e3+-1e11)
        .replace(/[018]/g, c =>
          (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
    }

    function appendTarget(label) {
      const container = document.getElementById('plugin-container');
      const wrap = document.createElement('div');
      const title = document.createElement('div');
      const target = document.createElement('div');

      title.className = 'plugin-label';
      title.textContent = label;

      target.className = 'plugin-target';
      target.id = `plugin-target-${Date.now()}-${Math.random().toString(36).slice(2)}`;

      wrap.appendChild(title);
      wrap.appendChild(target);
      container.appendChild(wrap);

      target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return `#${target.id}`;
    }

    // Base props (no blocking alerts)
    function baseProps() {
      return {
        name: 'collectAccountInformation',
        environment: DEFAULTS.environment,
        onError: (err) => { console.error(err); renderResult({ error: String(err?.message || err) }); }
      };
    }

    // Launchers (do NOT clear/destroy prior plugins)
    function launch(buildCfg, label) {
      // Clear the side result immediately when switching/launching another plugin
      clearResultPanel();

      const target = appendTarget(label);
      const cfg = buildConfig();
      const referenceId = genReferenceId();

      new Veem.WebSDK({
        ...baseProps(),
        target,
        referenceId,
        preset: { amount: 500, currencyCode: 'USD' },
        onExit: () => {
          // No clearing of plugin; simply reflect exit state
          renderResult({ status: 'exit', referenceId });
        },
        onComplete: ({ referenceId, userInputs, preset }) => {
          // Show results; DO NOT clear/destroy the plugin instance
          renderResult({ status: 'complete', referenceId, preset, userInputs });
        },
        configuration: buildCfg(cfg)
      });
    }

    // Wire buttons
    document.getElementById('btn-card').addEventListener('click', () =>
      launch(cfg => ({ ...cfg, paymentOptions: [{ type: 'Card', header: 'Customized header' }] }), 'Card Plugin')
    );
    document.getElementById('btn-bank').addEventListener('click', () =>
      launch(cfg => ({ ...cfg, paymentOptions: [{ type: 'Bank', header: 'Bank Account Information' }] }), 'Bank Plugin')
    );
    document.getElementById('btn-boi').addEventListener('click', () =>
      launch(cfg => ({ ...cfg, collectedInformationOptions: [{ type: 'BeneficialOwnershipInformation', header: 'Beneficial Ownership Information' }] }), 'BOI Plugin')
    );
  </script>
</body>
</html>
