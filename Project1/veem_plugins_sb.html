<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veem – Unified Plugin Tester</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/veem-web-sdk@^0/umd/index.min.js" type="application/javascript"></script>
  <style>
    :root {
      --primary: #0057ff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --bg: #f9fafb;
      --card: #ffffff;
      --border: #e5e7eb;
      --btn: #0057ff;
      --btn-hover: #0041cc;
      --btn-text: #ffffff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; }
    h1 { margin: 0; font-size: 1.25rem; }
    .grid {
      display: grid; grid-template-columns: repeat(6, minmax(0,1fr));
      gap: .75rem; padding: 1rem 1.5rem; background: var(--card);
      border-bottom: 1px solid var(--border); align-items: center;
    }
    .grid label { text-align: right; color: var(--muted); font-size: .9rem; }
    .grid input { width: 100%; padding: .55rem .65rem; border: 1px solid #d1d5db; border-radius: .5rem; font-size: .95rem; background: #fff; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; padding: .75rem 1.5rem 1.25rem; background: var(--card); border-bottom: 1px solid var(--border); }
    button.primary { background: var(--btn); color: var(--btn-text); border: none; border-radius: .5rem; padding: .6rem 1rem; font-weight: 600; cursor: pointer; }
    button.primary:hover { background: var(--btn-hover); }
    button.ghost { background: transparent; border: 1px solid var(--border); border-radius: .5rem; padding: .55rem .9rem; color: var(--text); cursor: pointer; }
    .hint { font-size: .85rem; color: var(--muted); padding: 0 1.5rem 1rem; background: var(--card); border-bottom: 1px solid var(--border); }
    #plugin-container { max-width: 860px; margin: 1rem auto; padding: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: .75rem; min-height: 200px; }
  </style>
</head>
<body>
  <header>
    <h1>Veem – Unified Plugin Tester</h1>
  </header>

  <!-- Inputs (preloaded + URL-prefill) -->
  <div class="grid">
    <label for="accountId">accountId</label>
    <input id="accountId" type="number" placeholder="accountId" />

    <label for="sessionSecret">sessionSecret</label>
    <input id="sessionSecret" type="text" placeholder="sessionSecret" />

    <label for="clientId">clientId</label>
    <input id="clientId" type="text" placeholder="clientId" />
  </div>

  <div class="hint">
    Tip: you can prefill via URL, e.g.
    <code>?accountId=973226&amp;sessionSecret=b45091d6550ec6656bb0a294b5859057&amp;clientId=testQAwhish-5XG09EeqyV</code>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button class="primary" id="btn-card">Collect card info</button>
    <button class="primary" id="btn-bank">Collect bank info</button>
    <button class="primary" id="btn-boi">Collect BOI info</button>
    <button class="ghost" id="btn-update-url" title="Write current inputs to the page URL">Update URL</button>
  </div>

  <!-- Single container; a new target div is created for each launch -->
  <div id="plugin-container"></div>

  <script>
    // --- CONSTANT DEFAULTS (VISIBLE) ---
    const DEFAULTS = {
      accountId: "973226",
      sessionSecret: "b45091d6550ec6656bb0a294b5859057",
      clientId: "testQAwhish-5XG09EeqyV",
      environment: "sandbox" // keep 'sandbox' as per your earlier pages
    };

    // Prefill inputs from URL or defaults
    (function prefill() {
      const params = new URLSearchParams(window.location.search);
      const accountId = params.get("accountId") || DEFAULTS.accountId;
      const sessionSecret = params.get("sessionSecret") || DEFAULTS.sessionSecret;
      const clientId = params.get("clientId") || DEFAULTS.clientId;

      document.getElementById("accountId").value = accountId;
      document.getElementById("sessionSecret").value = sessionSecret;
      document.getElementById("clientId").value = clientId;
    })();

    function writeInputsToUrl() {
      const q = new URLSearchParams({
        accountId: document.getElementById("accountId").value || DEFAULTS.accountId,
        sessionSecret: document.getElementById("sessionSecret").value || DEFAULTS.sessionSecret,
        clientId: document.getElementById("clientId").value || DEFAULTS.clientId,
      });
      const newUrl = `${location.pathname}?${q.toString()}`;
      history.replaceState(null, "", newUrl);
    }

    // Shared SDK props (like the other env reference)
    const commonSdkProps = {
      name: 'collectAccountInformation',
      environment: DEFAULTS.environment,
      onExit: () => window.alert('exit'),
      onError: (err) => console.error(err),
      onComplete: ({ referenceId, userInputs, preset }) => {
        const listString = `
referenceId: ${referenceId}
preset: ${JSON.stringify(preset, null, 2)}
userInputs: ${JSON.stringify(userInputs, null, 2)}
        `;
        window.alert(listString);
      },
      preset: { amount: 500, currencyCode: 'USD' },
      // referenceId and target will be set at launch time
    };

    // Build configuration from inputs (with fallbacks)
    function buildCommonConfig() {
      const accountId = (document.getElementById("accountId").value || DEFAULTS.accountId).trim();
      const sessionSecret = (document.getElementById("sessionSecret").value || DEFAULTS.sessionSecret).trim();
      const clientId = (document.getElementById("clientId").value || DEFAULTS.clientId).trim();

      return {
        accountId: Number(accountId),
        clientId,
        sessionSecret,
        style: {
          typography: {
            fontFamily: 'Roboto',
            color: '#1A1A1A',
            weight: 400,
            fontSize: 14,
            error: { fontFamily: 'Roboto', fontSize: 14, weight: 400, color: '#B6353B' },
          },
          header: { fontFamily: 'Roboto', fontSize: 22, weight: 700 },
          input: {
            backgroundColor: '#FFF',
            borderColor: '#B0B7BF',
            placeholderColor: '#B0B7BF',
            height: 36,
            borderRadius: 2,
            paddingTop: 8, paddingRight: 8, paddingBottom: 8, paddingLeft: 16,
            error: {
              backgroundColor: '#FFEBEC',
              borderColor: '#B6353B',
              placeholderColor: '#B0B7BF',
              height: 36,
              borderRadius: 2,
              paddingTop: 8, paddingRight: 8, paddingBottom: 8, paddingLeft: 16,
            },
          },
          button: {
            height: 40, minWidth: 100,
            padding: { top: 10, right: 24, bottom: 10, left: 24 },
            textTransform: 'capitalize',
            backgroundColor: '#1A1A1A', color: '#FFF',
            fontFamily: 'Roboto', fontSize: 16, weight: 600, borderRadius: 4,
            border: { color: '#1A1A1A', width: 1, style: 'solid' },
            hover: { backgroundColor: '#333333', color: '#FFF' },
            disabled: { backgroundColor: '#E0E0E0', color: '#B0B7BF' },
          },
        },
      };
    }

    // Fresh mount target + unique referenceId on every launch
    function createFreshTarget() {
      const container = document.getElementById('plugin-container');
      container.innerHTML = ''; // remove previous node entirely
      const freshId = `plugin-target-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const div = document.createElement('div');
      div.id = freshId;
      container.appendChild(div);
      return `#${freshId}`;
    }

    function genReferenceId() {
      // RFC4122-ish unique id
      return 'ref-' + ([1e7]+-1e3+-4e3+-8e3+-1e11)
        .replace(/[018]/g, c =>
          (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
    }

    // Initializers
    function initCard() {
      new Veem.WebSDK({
        ...commonSdkProps,
        target: createFreshTarget(),
        referenceId: genReferenceId(),
        configuration: {
          ...buildCommonConfig(),
          paymentOptions: [{ type: 'Card', header: 'Customized header' }],
        },
      });
    }

    function initBank() {
      new Veem.WebSDK({
        ...commonSdkProps,
        target: createFreshTarget(),
        referenceId: genReferenceId(),
        configuration: {
          ...buildCommonConfig(),
          paymentOptions: [{ type: 'Bank', header: 'Bank Account Information' }],
        },
      });
    }

    function initBOI() {
      new Veem.WebSDK({
        ...commonSdkProps,
        target: createFreshTarget(),
        referenceId: genReferenceId(),
        configuration: {
          ...buildCommonConfig(),
          collectedInformationOptions: [
            { type: 'BeneficialOwnershipInformation', header: 'Beneficial Ownership Information' }
          ],
        },
      });
    }

    // Wire buttons
    document.getElementById('btn-card').addEventListener('click', initCard);
    document.getElementById('btn-bank').addEventListener('click', initBank);
    document.getElementById('btn-boi').addEventListener('click', initBOI);
    document.getElementById('btn-update-url').addEventListener('click', writeInputsToUrl);
  </script>
</body>
</html>
