<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plugin Loader</title>
  <style>
    :root {
      --primary-color: #0057ff;
      --text-color: #212121;
      --background-color: #f9f9f9;
      --button-bg: #0057ff;
      --button-color: #ffffff;
      --button-hover-bg: #0041cc;
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: var(--text-color);
    }

    header {
      background-color: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 1rem 2rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-weight: 600;
      font-size: 1.5rem;
    }

    .inputs-bar {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0.75rem;
      padding: 1rem 2rem;
      background-color: white;
      border-bottom: 1px solid #e0e0e0;
      align-items: center;
    }

    .inputs-bar label {
      font-size: 0.9rem;
      color: #555;
      grid-column: span 1;
      text-align: right;
      padding-right: 0.25rem;
    }

    .inputs-bar input {
      grid-column: span 2;
      padding: 0.5rem 0.6rem;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      font-size: 0.95rem;
      width: 100%;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0.75rem 2rem;
      background-color: white;
      border-bottom: 1px solid #e0e0e0;
    }

    button {
      padding: 0.65rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 500;
      background-color: var(--button-bg);
      color: var(--button-color);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--button-hover-bg);
    }

    .iframe-container {
      flex: 1;
      padding: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .helper {
      font-size: 0.8rem;
      color: #666;
      padding: 0 2rem 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Plugin Loader</h1>
  </header>

  <div class="inputs-bar">
    <label for="accountId">accountId</label>
    <input id="accountId" name="accountId" type="number" placeholder="accountId" />
    <label for="sessionSecret">sessionSecret</label>
    <input id="sessionSecret" name="sessionSecret" type="text" placeholder="sessionSecret" />
    <label for="clientId">clientId</label>
    <input id="clientId" name="clientId" type="text" placeholder="clientId" />
  </div>

  <div class="helper">Values can also be prefilled using this page’s URL, e.g. <code>?accountId=973226&amp;sessionSecret=...&amp;clientId=...</code></div>

  <div class="button-container">
    <button data-url="https://ebadawi.github.io/Project1/card2.html">Card Plugin</button>
    <button data-url="https://ebadawi.github.io/Project1/bank2.html">Bank Plugin</button>
    <button data-url="https://ebadawi.github.io/Project1/boi2.html">BOI Plugin</button>
  </div>

  <div class="iframe-container">
    <iframe id="pluginFrame" src=""></iframe>
  </div>

  <script>
    // Defaults as requested
    const DEFAULTS = {
      accountId: "973226",
      sessionSecret: "b45091d6550ec6656bb0a294b5859057",
      clientId: "testQAwhish-5XG09EeqyV",
    };

    // Prefill inputs from URL or defaults
    (function initInputs() {
      const params = new URLSearchParams(window.location.search);
      const accountId = params.get("accountId") || DEFAULTS.accountId;
      const sessionSecret = params.get("sessionSecret") || DEFAULTS.sessionSecret;
      const clientId = params.get("clientId") || DEFAULTS.clientId;

      document.getElementById("accountId").value = accountId;
      document.getElementById("sessionSecret").value = sessionSecret;
      document.getElementById("clientId").value = clientId;
    })();

    function buildPluginUrl(baseUrl) {
      const accountId = (document.getElementById("accountId").value || "").trim();
      const sessionSecret = (document.getElementById("sessionSecret").value || "").trim();
      const clientId = (document.getElementById("clientId").value || "").trim();

      // Fallback to defaults if any are blank
      const vals = {
        accountId: accountId || DEFAULTS.accountId,
        sessionSecret: sessionSecret || DEFAULTS.sessionSecret,
        clientId: clientId || DEFAULTS.clientId,
      };

      const q = new URLSearchParams({
        accountId: vals.accountId,
        sessionSecret: vals.sessionSecret,
        clientId: vals.clientId,
      });

      // Preserve any existing query on the baseUrl
      const [base, existingQuery] = baseUrl.split("?");
      const merged = new URLSearchParams(existingQuery || "");
      q.forEach((v, k) => merged.set(k, v));

      return `${base}?${merged.toString()}`;
    }

    function loadPlugin(url) {
      document.getElementById("pluginFrame").src = buildPluginUrl(url);
    }

    // Wire up buttons
    document.querySelectorAll(".button-container button").forEach(btn => {
      btn.addEventListener("click", () => loadPlugin(btn.getAttribute("data-url")));
    });
  </script>
</body>
</html>
