<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veem – Unified Plugin Tester (Multi-Env)</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/veem-web-sdk@^0/umd/index.min.js" type="application/javascript"></script>
  <style>
    :root { --border:#e5e7eb; --card:#fff; --bg:#f9fafb; --btn:#0057ff; --btn-hover:#0041cc; --text:#1a1a1a; --muted:#6b7280; }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Roboto',system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:1rem 1.5rem}
    h1{margin:0;font-size:1.25rem}
    .grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.75rem;padding:1rem 1.5rem;background:var(--card);border-bottom:1px solid var(--border);align-items:center}
    .grid label{text-align:right;color:var(--muted);font-size:.9rem}
    .grid input,.grid select{width:100%;padding:.55rem .65rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.95rem;background:#fff}
    .grid .grid-full{grid-column:1/-1}
    .grid label.checkbox{display:flex;gap:.5rem;align-items:center;justify-content:flex-start;text-align:left;color:var(--muted);font-size:.95rem}
    .grid label.checkbox input{width:auto;padding:0}
    .actions{display:flex;flex-wrap:wrap;gap:.75rem;padding:.75rem 1.5rem 1.25rem;background:var(--card);border-bottom:1px solid var(--border)}
    button{border:none;border-radius:.5rem;padding:.6rem 1rem;font-weight:600;cursor:pointer}
    .primary{background:var(--btn);color:#fff}
    .primary:hover{background:var(--btn-hover)}
    #layout{display:grid;grid-template-columns:1fr 360px;gap:1rem;max-width:1200px;margin:1rem auto;padding:0 1rem}
    #plugin-card,#result-card{background:var(--card);border:1px solid var(--border);border-radius:.75rem}
    #plugin-card{min-height:240px;padding:1rem}
    #plugin-target{min-height:200px}
    #result-card header{padding:.75rem 1rem;border-bottom:1px solid var(--border);font-weight:700}
    #result{padding:1rem;max-height:420px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:.9rem;white-space:pre-wrap}
    @media (max-width: 768px) {
          #layout {
                 display: flex;
                 flex-direction: column;
            }
          #plugin-card {
                 min-width: 50%;
            }
        }
  </style>
</head>
<body>
  <header><h1>Veem – Unified Plugin Tester</h1></header>

  <div class="grid">
    <label for="env">environment</label>
    <select id="env">
      <option value="sandbox">sandbox</option>
      <option value="qa">qa</option>
      <option value="production">production</option>
    </select>

    <label for="accountId">accountId</label>
    <input id="accountId" type="number" placeholder="accountId" />

    <label for="sessionSecret">sessionSecret</label>
    <input id="sessionSecret" type="text" placeholder="sessionSecret" />

    <label for="clientId">clientId</label>
    <input id="clientId" type="text" placeholder="clientId" />

    <div class="grid-full">
      <label class="checkbox" for="includeAccountPresets">
        <input id="includeAccountPresets" type="checkbox" />
        include account presets
      </label>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="btn-card">Collect card info</button>
    <button class="primary" id="btn-bank">Collect bank info</button>
    <button class="primary" id="btn-boi">Collect BOI info</button>
    <button class="primary" id="btn-onboard">Collect onboarding account info</button>
    <button class="primary" id="btn-idcheck">Collect ID document</button>
    <a href="veem_payee_plugin.html">
      <button class="primary" id="btn-payee">Collect payee info</button>
    </a>
  </div>

  <div id="layout">
    <div id="plugin-card">
      <div id="plugin-target"><!-- one plugin at a time --></div>
    </div>
    <aside id="result-card">
      <header>Latest callback result</header>
      <div id="result">No results yet.</div>
    </aside>
  </div>

  <script>
    // Per-environment presets (your provided values)
    const ENV_PRESETS = {
      sandbox: {
        accountId: "973226",
        sessionSecret: "b45091d6550ec6656bb0a294b5859057",
        clientId: "testQAwhish-5XG09EeqyV",
      },
      qa: {
        accountId: "391558",
        sessionSecret: "7cdcd2682c5250d557011a6516ce6d40",
        clientId: "4c055b2e-8553-4bfe-ad27-8b5fd10ba6a3",
      },
      production: {
        accountId: "1691334", // add your production accountId here
        sessionSecret: "3651237067ea42e21cf08ac207c25f4e", // add your production sessionSecret here
        clientId: "", // add your production clientId here
        apiUrl: "https://api.veem.com",
        appUrl: "https://apps.veem.com"
      }
    };

    // Visible defaults (initial env = sandbox)
    const DEFAULT_ENV = "sandbox";

    // Prefill from URL if present, otherwise from env presets
    (function prefill() {
      const p = new URLSearchParams(location.search);
      const envParam = p.get("env");
      env.value = envParam && ENV_PRESETS[envParam] ? envParam : DEFAULT_ENV;

      const preset = ENV_PRESETS[env.value];

      accountId.value     = p.get("accountId")    || preset.accountId;
      sessionSecret.value = p.get("sessionSecret")|| preset.sessionSecret;
      clientId.value      = p.get("clientId")     || preset.clientId;
    })();

    // If environment changes, load that env's presets into inputs
    env.addEventListener('change', () => {
      const preset = ENV_PRESETS[env.value];
      accountId.value = preset.accountId;
      sessionSecret.value = preset.sessionSecret;
      clientId.value = preset.clientId;
    });

    // One active instance at a time
    let currentInstance = null;

    // Helpers
    const renderResult = (payload) => {
      const el = document.getElementById('result');
      el.textContent = payload ? (typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2)) : '';
    };

    const clearResultPanel = () => renderResult('');

    const buildConfig = () => ({
      accountId: Number(accountId.value),
      sessionSecret: sessionSecret.value.trim(),
      clientId: clientId.value.trim(),
      style: {
        typography: {
          fontFamily: 'Roboto', color: '#1A1A1A', weight: 400, fontSize: 14,
          error: { fontFamily: 'Roboto', fontSize: 14, weight: 400, color: '#B6353B' },
        },
        header: { fontFamily: 'Roboto', fontSize: 22, weight: 700 },
        input: {
          backgroundColor: '#FFF', borderColor: '#B0B7BF', placeholderColor: '#B0B7BF', height: 36, borderRadius: 2,
          paddingTop: 8, paddingRight: 8, paddingBottom: 8, paddingLeft: 16,
          error: {
            backgroundColor: '#FFEBEC', borderColor: '#B6353B', placeholderColor: '#B0B7BF',
            height: 36, borderRadius: 2, paddingTop: 8, paddingRight: 8, paddingBottom: 8, paddingLeft: 16,
          },
        },
        button: {
          height: 40, minWidth: 100,
          padding: { top: 10, right: 24, bottom: 10, left: 24 },
          textTransform: 'capitalize', backgroundColor: '#1A1A1A', color: '#FFF',
          fontFamily: 'Roboto', fontSize: 16, weight: 600, borderRadius: 4,
          border: { color: '#1A1A1A', width: 1, style: 'solid' },
          hover: { backgroundColor: '#333333', color: '#FFF' },
          disabled: { backgroundColor: '#E0E0E0', color: '#B0B7BF' },
        },
      },
    });

    const genReferenceId = () =>
      'ref-' + ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
      );

    const freshenTarget = () => {
      const holder = document.getElementById('plugin-target');
      holder.innerHTML = '';
      const div = document.createElement('div');
      div.id = 'plugin-mount';
      holder.appendChild(div);
      return '#plugin-mount';
    };

    const baseProps = () => ({
      name: 'collectAccountInformation',
      environment: env.value, // 'sandbox', 'qa', or 'production'
      onError: (err) => { console.error(err); renderResult({ error: String(err?.message || err) }); },
    });

    const buildPreset = () => {
      const preset = { amount: 500, currencyCode: 'USD' };
      if (includeAccountPresets && includeAccountPresets.checked) {
        preset.account = {
          type: 'Personal',
          //countryCode: 'US',
          business: {
            entity: 'SoleProprietorship',
            taxId: '999-99-9999',
            address: {
              street: '123 Main St',
              city: 'San Francisco',
              stateProvince: 'CA',
              postalCode: '94105',
              countryCode: 'US',
            },
            displayName: 'John Doe Consulting',
            industry: "Business Services",
            subIndustry: "Affiliate Marketing",
            occupation: "Software Engineer",
          },
          contact: {
            countryDialCode: '+1',
            phoneNumber: '2027524129',
            firstName: 'John',
            lastName: 'Doe',
            dob: "12/20/2007",
          },
        };
      }
      return preset;
    };

    function launchPlugin(configBuilder) {
      clearResultPanel();
      if (currentInstance && typeof currentInstance.destroy === 'function') {
        try { currentInstance.destroy(); } catch (e) { console.warn('destroy failed', e); }
        currentInstance = null;
      }
      const target = freshenTarget();
      const configuration = configBuilder(buildConfig());
      const referenceId = genReferenceId();
      currentInstance = new Veem.WebSDK({
        ...baseProps(),
        target,
        referenceId,
        preset: buildPreset(),
        onComplete: ({ referenceId, userInputs, preset }) => {
          renderResult({ status: 'complete', referenceId, preset, userInputs, environment: env.value });
        },
        onExit: () => {
          renderResult({ status: 'exit', environment: env.value });
          currentInstance = null;
        },
        configuration
      });
    }

    // Buttons
    document.getElementById('btn-card').addEventListener('click', () =>
      launchPlugin(cfg => ({ ...cfg, paymentOptions: [{ type: 'Card', header: 'Customized header', placeholders: { 
        name: 'Give us your name',
        lastName: 'Give your last name',
        cardNumber: 'such as: 1234 5678 9012 3456', 
        expirationMonth: 'Month', 
        expirationYear: 'Year', 
        securityCode: 'CVV: Card Verification Value'
      } }] }))
    );

    document.getElementById('btn-bank').addEventListener('click', () =>
      launchPlugin(cfg => ({ ...cfg, paymentOptions: [{ type: 'Bank', header: 'Bank Account Information' }] }))
    );

    document.getElementById('btn-boi').addEventListener('click', () =>
      launchPlugin(cfg => ({ ...cfg, collectedInformationOptions: [{ type: 'BeneficialOwnershipInformation', header: 'Beneficial Ownership Information' }] }))
    );

    document.getElementById('btn-onboard').addEventListener('click', () =>
      launchPlugin(cfg => ({ ...cfg, collectedInformationOptions: [{ type: 'OnboardingInformation', header: 'Complete Your Account Information' }] }))
    );

    document.getElementById('btn-idcheck').addEventListener('click', () =>
      launchPlugin(cfg => ({ ...cfg, allowAccess: true, collectedInformationOptions: [{ type: 'IdentificationDocumentInformation', header: 'Complete Your ID' }]}))
    );
   // document.getElementById('btn-idcheck').addEventListener('click', () =>
    //launchPlugin(cfg => ({ ...cfg, collectedInformationOptions: [{ type: 'identityCheck', header: 'Identity Check' }]}))
    //);
  </script>
</body>
</html>
