<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veem – Payee Plugin Tester (Multi-Env)</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/veem-web-sdk@^0/umd/index.min.js" type="application/javascript"></script>
  <style>
    :root { --border:#e5e7eb; --card:#fff; --bg:#f9fafb; --btn:#0057ff; --btn-hover:#0041cc; --text:#1a1a1a; --muted:#6b7280; }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Roboto',system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{background:var(--card);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
    h1{margin:0;font-size:1.25rem}
    .back-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:0.5rem 1rem;border-radius:0.5rem;text-decoration:none;font-size:0.9rem}
    .back-btn:hover{background:var(--border)}
    .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.75rem;padding:1rem 1.5rem;background:var(--card);border-bottom:1px solid var(--border);align-items:center}
    .fieldGroup{display:flex;flex-direction:column;gap:.5rem;align-items: flex-start;}
    .grid label{text-align:right;color:var(--muted);font-size:.9rem}
    .grid input,.grid select{width:100%;padding:.55rem .65rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.95rem;background:#fff}
    .actions{display:flex;flex-wrap:wrap;gap:.75rem;padding:.75rem 1.5rem 1.25rem;background:var(--card);border-bottom:1px solid var(--border)}
    button{border:none;border-radius:.5rem;padding:.6rem 1rem;font-weight:600;cursor:pointer}
    .primary{background:var(--btn);color:#fff}
    .primary:hover{background:var(--btn-hover)}
    #layout{display:grid;grid-template-columns:1fr 360px;gap:1rem;max-width:1200px;margin:1rem auto;padding:0 1rem}
    #plugin-card,#result-card{background:var(--card);border:1px solid var(--border);border-radius:.75rem}
    #plugin-card{min-height:240px;padding:1rem}
    #plugin-target{min-height:200px}
    #result-card header{padding:.75rem 1rem;border-bottom:1px solid var(--border);font-weight:700}
    #result{padding:1rem;max-height:420px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:.9rem;white-space:pre-wrap}
    @media (max-width: 768px) {
          #layout {
                 display: flex;
                 flex-direction: column;
            }
          #plugin-card {
                 min-width: 50%;
            }
        }
  </style>
</head>
<body>
  <header>
    <h1>Veem – Payee Plugin Tester</h1>
    <a href="veem_plugins.html" class="back-btn">← Back to Main</a>
  </header>

  <div class="grid">
    <div class="fieldGroup">
      <label for="env">environment</label>
      <select id="env">
        <option value="sandbox">sandbox</option>
        <option value="qa">qa</option>
        <option value="production">production</option>
        <option value="localqa">localqa</option>
      </select>
    </div>

    <div class="fieldGroup">
      <label for="claimLink">claimLink</label>
      <input id="claimLink" type="text" placeholder="claimLink" placeholder="https://api.qa-us-west-2.veem.com/api/c/shortCode"/>
    </div>

    <div class="fieldGroup">
      <label for="email">email</label>
      <input id="email" type="email" placeholder="payee email" placeholder="payee@example.com"/>
    </div>

    <div class="fieldGroup">
      <label for="accountId">accountId</label>
      <input id="accountId" type="number" placeholder="accountId" />
    </div>

    <div class="fieldGroup">
      <label for="sessionSecret">sessionSecret</label>
      <input id="sessionSecret" type="text" placeholder="sessionSecret" />
    </div>

    <div class="fieldGroup">
      <label for="clientId">clientId</label>
      <input id="clientId" type="text" placeholder="clientId" />
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="btn-payee">Launch Payee Plugin</button>
  </div>

  <div id="layout">
    <div id="plugin-card">
      <div id="plugin-target"><!-- payee plugin will load here --></div>
    </div>
    <aside id="result-card">
      <header>Latest callback result</header>
      <div id="result">No results yet.</div>
    </aside>
  </div>

  <script>
    const ENV_PRESETS = {
      sandbox: {
        accountId: "973226",
        sessionSecret: "b45091d6550ec6656bb0a294b5859057",
        clientId: "testQAwhish-5XG09EeqyV",
      },
      qa: {
        accountId: "391558",
        sessionSecret: "7cdcd2682c5250d557011a6516ce6d40",
        clientId: "4c055b2e-8553-4bfe-ad27-8b5fd10ba6a3",
      },
      production: {
        accountId: "1691334",
        sessionSecret: "3651237067ea42e21cf08ac207c25f4e",
        clientId: "",
      }
    };

    // Visible defaults (initial env = sandbox)
    const DEFAULT_ENV = "qa";

    // Prefill from URL if present
    (function prefill() {
      const p = new URLSearchParams(location.search);
      const envParam = p.get("env");
      env.value = envParam && ENV_PRESETS[envParam] ? envParam : DEFAULT_ENV;
      const envPreset = ENV_PRESETS[env.value];
      claimLink.value = p.get("claimLink") || "";
      email.value = p.get("email") || "";
      accountId.value = p.get("accountId") || envPreset.accountId;
      sessionSecret.value = p.get("sessionSecret") || envPreset.sessionSecret;
      clientId.value = p.get("clientId") || envPreset.clientId;
    })();

    env.addEventListener('change', () => {
      const envPreset = ENV_PRESETS[env.value];
      accountId.value = envPreset.accountId;
      sessionSecret.value = envPreset.sessionSecret;
      clientId.value = envPreset.clientId;
    });

    // One active instance at a time
    let currentInstance = null;

    // Helpers
    const renderResult = (payload) => {
      const el = document.getElementById('result');
      el.textContent = payload ? (typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2)) : '';
    };

    const clearResultPanel = () => renderResult('');

    const genReferenceId = () =>
      'ref-' + ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
      );

    const freshenTarget = () => {
      const holder = document.getElementById('plugin-target');
      holder.innerHTML = '';
      const div = document.createElement('div');
      div.id = 'plugin-mount';
      holder.appendChild(div);
      return '#plugin-mount';
    };

    // Payee Plugin Button
    document.getElementById('btn-payee').addEventListener('click', () => {
      clearResultPanel();
      if (currentInstance && typeof currentInstance.destroy === 'function') {
        try { currentInstance.destroy(); } catch (e) { console.warn('destroy failed', e); }
        currentInstance = null;
      }
      const target = freshenTarget();
      const referenceId = genReferenceId();
      const configuration = {
        accountId: Number(accountId.value),
        sessionSecret: sessionSecret.value.trim(),
        clientId: clientId.value.trim(),
      };
      currentInstance = new Veem.WebSDK({
        name: 'payeePlugin',
        environment: env.value,
        target,
        referenceId,
        preset: {
          claimLink: claimLink?.value?.trim(),
          email: email?.value?.trim(),
        },
        configuration,
        onComplete: ({ referenceId, userInputs, preset }) => {
          renderResult({ status: 'complete', referenceId, preset, userInputs, environment: env.value });
        },
        onExit: () => {
          renderResult({ status: 'exit', environment: env.value });
          currentInstance = null;
        },
        onError: (err) => { console.error(err); renderResult({ error: String(err?.message || err) }); },
      });
    });
  </script>
</body>
</html>
